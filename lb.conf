# Sample load balancer configuration.
# Run with:  java -jar target/load-balancer.jar --config lb.conf
# Any value here can be overridden on the command line (e.g. --port 9090).
#
# Keys are the option's long name without the leading dashes (picocli
# PropertiesDefaultProvider), so --health-rise maps to health-rise.

host=0.0.0.0
port=8080

# Comma-separated backend servers to balance across (host:port).
backends=127.0.0.1:9001,127.0.0.1:9002,127.0.0.1:9003

# Balancing strategy: round-robin | least-connections
strategy=round-robin

# Active health checking (how a backend is removed / re-added).
health-interval-ms=2000
health-timeout-ms=1000
health-rise=2
health-fall=3

# Backend connect timeout for real client traffic.
connect-timeout-ms=2000

# Cap on concurrent client connections (backpressure).
max-connections=1000

# Drop a connection that has been idle this long (ms). 0 disables.
idle-timeout-ms=300000

# How often to print a stats line. 0 disables.
stats-interval-ms=5000
